name: mobile
description: "AI-Powered Rural Entrepreneur Empowerment Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Data & Serialization
  freezed_annotation: any
  json_annotation: any

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Routing
  go_router: ^13.1.0

  # Local Caching & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Utilities
  connectivity_plus: any
  intl: any
  uuid: ^4.6.0
  cached_network_image: ^3.3.1

  # HTTP Client (OpenAPI generated SDK compatible)
  dio: ^5.4.0

  # Icons & UI Helper
  cupertino_icons: ^1.0.6
  google_fonts: ^8.2.1
  timeago: ^3.7.1
  path_provider: ^2.1.6
  crypto: ^3.0.7
  flutter_local_notifications: ^22.2.0
  url_launcher: ^6.2.5
  speech_to_text: any
  flutter_tts: any
  lucide_icons_flutter: ^3.1.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  freezed: any
  json_serializable: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/
