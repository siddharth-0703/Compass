version: '3.8'

services:
  # Infrastructure Dependencies
  mongodb:
    image: mongo:6
    container_name: rural_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - rural_backend_net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: rural_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rural_backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rural_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rural_backend_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Services
  ai-service:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: rural_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - AI_SERVICE_API_KEY=dev-secret-key-123
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - rural_backend_net

  core-api:
    build:
      context: .
      dockerfile: ./services/api/Dockerfile
    container_name: rural_core_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/rural_dev
      - REDIS_HOST=redis
      - AI_SERVICE_URL=http://ai-service:8000/api/v1/ai
      - AI_SERVICE_API_KEY=dev-secret-key-123
      - JWT_SECRET=super_secret_dev_key
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rural_backend_net
      - rural_frontend_net

  worker:
    build:
      context: .
      dockerfile: ./services/worker/Dockerfile
    container_name: rural_worker
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongodb:27017/rural_dev
      - REDIS_HOST=redis
      - AI_SERVICE_URL=http://ai-service:8000/api/v1/ai
      - AI_SERVICE_API_KEY=dev-secret-key-123
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rural_backend_net

volumes:
  mongodb_data:
  redis_data:
  qdrant_data:

networks:
  rural_frontend_net:
  rural_backend_net:
