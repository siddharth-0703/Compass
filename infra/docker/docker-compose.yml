version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: rural_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  redis:
    image: redis:7.0-alpine
    container_name: rural_redis
    ports:
      - "6379:6379"
    restart: always

  # API Gateway
  gateway:
    image: nginx:alpine
    container_name: rural_gateway
    ports:
      - "8080:80"
    volumes:
      - ../../services/gateway/nginx.conf:/etc/nginx/nginx.conf
    restart: always

  # Express API (Skeleton to be built)
  api:
    build: 
      context: ../../
      dockerfile: services/api/Dockerfile
    container_name: rural_api
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/rural
      - REDIS_URL=redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      - redis
    restart: always

  # FastAPI AI Service
  ai:
    build:
      context: ../../
      dockerfile: services/ai/Dockerfile
    container_name: rural_ai
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    restart: always

  # Qdrant Vector DB
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rural_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

volumes:
  mongodb_data:
  qdrant_data:
